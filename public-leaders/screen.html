<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSF LDI — Room Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--green:#4E8209;--green2:#64A70B;--teal:#007F9B;--blue:#00A9CE;--magenta:#A5228E;--orange:#E57200;--violet:#5B4B8A;--ink:#12220a;}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;
    background:radial-gradient(1400px 800px at 50% -20%,#3f7a12,#1f3d0a 70%);overflow:hidden}
  h1,h2,h3{font-family:"Bitter",Georgia,serif}
  .top{height:12px;background:linear-gradient(90deg,var(--green2),var(--teal),var(--magenta))}
  .wrap{height:calc(100% - 12px);display:flex;flex-direction:column;padding:30px 40px 0}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
  .eyebrow{font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.85;margin:0 0 6px;color:#dbead0}
  header h1{font-size:44px;margin:0;line-height:1}
  .count{text-align:right}
  .count .n{font-size:72px;font-weight:800;line-height:1;letter-spacing:-2px}
  .count .l{font-size:16px;opacity:.85;margin-top:4px}
  main{flex:1;display:grid;grid-template-columns:1.5fr 1fr;gap:34px;padding:26px 0 10px;min-height:0}
  .boardpanel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:24px;position:relative;overflow:hidden}
  .canvas{position:absolute;inset:0}
  .bd{position:absolute;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 3px 10px rgba(0,0,0,.35);transition:opacity .5s}
  .bd.new{animation:pop 1.2s ease}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(0);}55%{transform:translate(-50%,-50%) scale(1.5);}100%{transform:translate(-50%,-50%) scale(1);}}
  .ranklabel{position:absolute;left:22px;top:18px;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;opacity:.7}
  .rankpanel h2{font-size:24px;margin:0 0 18px;letter-spacing:.3px}
  .rk{margin-bottom:16px}
  .rk .rl{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:600;margin-bottom:7px}
  .rk .rl .dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto}
  .rk .rl .v{margin-left:auto;font-weight:800}
  .rk .track{background:rgba(255,255,255,.14);border-radius:999px;height:14px;overflow:hidden}
  .rk .fill{height:100%;border-radius:999px;transition:width .8s cubic-bezier(.3,0,.2,1)}
  .ticker{height:64px;display:flex;align-items:center;gap:16px;border-top:1px solid rgba(255,255,255,.15);font-size:20px;overflow:hidden;white-space:nowrap}
  .ticker .tk{opacity:.55;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:13px;flex:0 0 auto}
  .ticker .flow{display:flex;gap:30px;animation:none}
  .ticker .item{display:inline-flex;align-items:center;gap:10px}
  .ticker .item .dot{width:12px;height:12px;border-radius:50%}
  .ticker .item.newest{color:#fff} .ticker .item{color:#e7f0dd;opacity:.9}
  .empty{opacity:.7;font-size:22px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}
</style>
</head>
<body>
<div class="top"></div>
<div class="wrap">
  <header>
    <div><p class="eyebrow">FY26 · Leadership Development Institute</p><h1>Where our leaders are focusing</h1></div>
    <div class="count"><div class="n" id="count">0</div><div class="l">leaders have shared their focus</div></div>
  </header>
  <main>
    <div class="boardpanel"><div class="ranklabel">The room</div><div class="canvas" id="canvas"></div><div class="empty" id="empty">Waiting for the first leader to add their focus…</div></div>
    <div class="rankpanel"><h2>Top competencies</h2><div id="ranking"></div></div>
  </main>
  <div class="ticker"><span class="tk">Just in</span><div class="flow" id="ticker"></div></div>
</div>
<script src="screen-ldi.js"></script>
</body>
</html>
