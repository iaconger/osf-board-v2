# Render.com blueprint. Push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" and point it at the repo. Render provisions the
# PostgreSQL database below, injects DATABASE_URL into the web service, and
# supports the WebSocket connection this app uses (PORT and RENDER_EXTERNAL_URL
# are injected automatically).

databases:
  - name: osf-strategy-db-v2
    # Real, managed PostgreSQL. Cards persist here across deploys/restarts.
    # "free" databases expire after ~30 days — move to a paid plan for a real launch.
    plan: free

services:
  - type: web
    name: osf-strategy-board-v2
    runtime: node
    # "starter" is always-on (recommended for a live event). "free" idle-sleeps,
    # but the app self-pings via RENDER_EXTERNAL_URL to stay awake on free too.
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Real database connection — wired automatically from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: osf-strategy-db-v2
          property: connectionString
      # Secret needed to download captured cards at /export?key=...
      - key: EXPORT_KEY
        generateValue: true
      # After the first deploy, set this to your Render URL so only your own
      # site can open WebSocket connections:
      # - key: ALLOWED_ORIGINS
      #   value: https://osf-strategy-board-v2.onrender.com
